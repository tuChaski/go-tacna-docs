  /tracking/position:
    post:
      tags: [Tracking]
      summary: Recibir posición GPS del conductor
      description: |
        Endpoint para que el conductor envíe su posición GPS cada 3-5 segundos.

        Requiere JWT con `role=conductor`, `conductorPerfilId`, `empresaId`,
        `microId` y `rutaId`. El servidor valida que el conductor siga asignado
        a `MICRO.conductor_actual_id` y que el micro pertenezca a la ruta.

        El servidor genera `fechaHora` al persistir la posición en
        `POSICION_GPS`; el cliente no envía timestamp.
      operationId: sendTrackingPosition
      x-required-roles: [conductor]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingPositionRequest'
      responses:
        '202':
          description: Posición aceptada y procesada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingPositionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /tracking/stop:
    post:
      tags: [Tracking]
      summary: Finalizar recorrido del conductor
      description: |
        Marca el micro como detenido, actualiza el estado operativo del conductor
        y emite el evento de detención a la sala de la ruta.

        Requiere JWT con `role=conductor`, `conductorPerfilId`, `empresaId`,
        `microId` y `rutaId`.
      operationId: stopTracking
      x-required-roles: [conductor]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: Recorrido finalizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingStopResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT emitido por `POST /auth/login`.

        Claims principales:
        - `sub`: id de USUARIO
        - `role`: pasajero | conductor | admin_general | admin_empresa
        - `empresaId`: empresa del usuario (null para admin_general y pasajero)
        - `conductorPerfilId`: id de CONDUCTOR_PERFIL (solo conductor)
        - `administradorPerfilId`: id de ADMINISTRADOR_EMPRESA_PERFIL
        - `microId` y `rutaId`: asignación vigente del conductor
        - `suscripcionId`: suscripción del pasajero, si aplica

        Ver [jwt-claims.md](jwt-claims.md).

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    EmpresaIdQuery:
      name: empresaId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    RutaIdQuery:
      name: rutaId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    UsuarioIdQuery:
      name: usuarioId
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    RolQuery:
      name: rol
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Rol'
    EstadoOperativoQuery:
      name: estadoOperativo
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/EstadoOperativoConductor'
    EstadoSuscripcionQuery:
      name: estado
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/EstadoSuscripcion'
    DesdeQuery:
      name: desde
      in: query
      required: false
      schema:
        type: string
        format: date-time
    HastaQuery:
      name: hasta
      in: query
      required: false
      schema:
        type: string
        format: date-time
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

  responses:
    BadRequest:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Token JWT inválido o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: El usuario no tiene permisos o no pertenece a la empresa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Datos válidos pero no procesables
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit excedido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Rol:
      type: string
      enum: [pasajero, conductor, admin_general, admin_empresa]

    EstadoOperativoConductor:
      type: string
      enum: [disponible, en_recorrido, sin_conexion]

    EstadoMicro:
      type: string
      enum: [disponible, en_recorrido, detenido, mantenimiento]

    EstadoSuscripcion:
      type: string
      enum: [activa, vencida, cancelada]

    Usuario:
      type: object
      required: [id, dni, nombre, apellido, correo, telefono, rol]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        dni:
          type: string
          minLength: 1
          maxLength: 20
          description: Documento de identidad para control local
        nombre:
          type: string
        apellido:
          type: string
        correo:
          type: string
          format: email
        telefono:
          type: string
          description: Teléfono obligatorio para contacto
        rol:
          $ref: '#/components/schemas/Rol'

    UsuarioCreate:
      type: object
      required: [dni, nombre, apellido, correo, telefono, password, rol]
      additionalProperties: false
      properties:
        dni:
          type: string
          minLength: 1
          maxLength: 20
        nombre:
          type: string
        apellido:
          type: string
        correo:
          type: string
          format: email
        telefono:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        rol:
          $ref: '#/components/schemas/Rol'

    UsuarioUpdate:
      type: object
      additionalProperties: false
      properties:
        dni:
          type: string
          minLength: 1
          maxLength: 20
        nombre:
          type: string
        apellido:
          type: string
        correo:
          type: string
          format: email
        telefono:
          type: string
        password:
          type: string
          format: password
          minLength: 8
        rol:
          $ref: '#/components/schemas/Rol'

    LoginRequest:
      type: object
      required: [identificador, password]
      additionalProperties: false
      properties:
        identificador:
          type: string
          description: DNI o correo del usuario
        password:
          type: string
          format: password

    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, usuario]
      additionalProperties: false
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Vigencia del access token en segundos
        usuario:
          $ref: '#/components/schemas/Usuario'

    Empresa:
      type: object
      required: [id, ruc, razonSocial, telefono, direccion]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        ruc:
          type: string
          pattern: '^[0-9]{11}$'
        razonSocial:
          type: string
        telefono:
          type: string
        direccion:
          type: string

    EmpresaCreate:
      type: object
      required: [ruc, razonSocial, telefono, direccion]
      additionalProperties: false
      properties:
        ruc:
          type: string
          pattern: '^[0-9]{11}$'
        razonSocial:
          type: string
        telefono:
          type: string
        direccion:
          type: string

    EmpresaUpdate:
      type: object
      additionalProperties: false
      properties:
        ruc:
          type: string
          pattern: '^[0-9]{11}$'
        razonSocial:
          type: string
        telefono:
          type: string
        direccion:
          type: string

    AdministradorEmpresaPerfil:
      type: object
      required: [id, usuarioId, empresaId, cargo]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        usuarioId:
          type: integer
          minimum: 1
        empresaId:
          type: integer
          minimum: 1
        cargo:
          type: string
          description: 'Ej: Gerente, Supervisor'

    AdministradorEmpresaPerfilCreate:
      type: object
      required: [usuarioId, empresaId, cargo]
      additionalProperties: false
      properties:
        usuarioId:
          type: integer
          minimum: 1
        empresaId:
          type: integer
          minimum: 1
        cargo:
          type: string

    AdministradorEmpresaPerfilUpdate:
      type: object
      additionalProperties: false
      properties:
        cargo:
          type: string

    ConductorPerfil:
      type: object
      required: [id, usuarioId, empresaId, licenciaConducir, estadoOperativo]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        usuarioId:
          type: integer
          minimum: 1
        empresaId:
          type: integer
          minimum: 1
        licenciaConducir:
          type: string
        estadoOperativo:
          $ref: '#/components/schemas/EstadoOperativoConductor'

    ConductorPerfilCreate:
      type: object
      required: [usuarioId, empresaId, licenciaConducir]
      additionalProperties: false
      properties:
        usuarioId:
          type: integer
          minimum: 1
        empresaId:
          type: integer
          minimum: 1
        licenciaConducir:
          type: string
        estadoOperativo:
          allOf:
            - $ref: '#/components/schemas/EstadoOperativoConductor'
          default: disponible

    ConductorPerfilUpdate:
      type: object
      additionalProperties: false
      properties:
        licenciaConducir:
          type: string
        estadoOperativo:
          $ref: '#/components/schemas/EstadoOperativoConductor'

    GeoJsonLineString:
      type: object
      required: [type, coordinates]
      additionalProperties: false
      description: |
        Geometría GeoJSON WGS84. Cada posición se expresa como
        [longitud, latitud].
      properties:
        type:
          type: string
          const: LineString
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 3
            items:
              type: number

    Ruta:
      type: object
      required: [id, empresaId, nombreRuta, trazadoRuta]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        empresaId:
          type: integer
          minimum: 1
        nombreRuta:
          type: string
        trazadoRuta:
          $ref: '#/components/schemas/GeoJsonLineString'

    RutaCreate:
      type: object
      required: [empresaId, nombreRuta, trazadoRuta]
      additionalProperties: false
      properties:
        empresaId:
          type: integer
          minimum: 1
        nombreRuta:
          type: string
        trazadoRuta:
          $ref: '#/components/schemas/GeoJsonLineString'

    RutaUpdate:
      type: object
      additionalProperties: false
      properties:
        nombreRuta:
          type: string
        trazadoRuta:
          $ref: '#/components/schemas/GeoJsonLineString'

    Micro:
      type: object
      required: [id, empresaId, rutaId, conductorActualId, placa, capacidadPasajeros, estado]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        empresaId:
          type: integer
          minimum: 1
        rutaId:
          type: integer
          minimum: 1
        conductorActualId:
          type:
            - integer
            - 'null'
          minimum: 1
          description: ID de CONDUCTOR_PERFIL en turno; null si no tiene conductor
        placa:
          type: string
        capacidadPasajeros:
          type: integer
          minimum: 1
          description: Capacidad para control de aforo
        estado:
          $ref: '#/components/schemas/EstadoMicro'

    MicroCreate:
      type: object
      required: [empresaId, rutaId, placa, capacidadPasajeros]
      additionalProperties: false
      properties:
        empresaId:
          type: integer
          minimum: 1
        rutaId:
          type: integer
          minimum: 1
        conductorActualId:
          type:
            - integer
            - 'null'
          minimum: 1
        placa:
          type: string
        capacidadPasajeros:
          type: integer
          minimum: 1
        estado:
          allOf:
            - $ref: '#/components/schemas/EstadoMicro'
          default: disponible

    MicroUpdate:
      type: object
      additionalProperties: false
      properties:
        rutaId:
          type: integer
          minimum: 1
        conductorActualId:
          type:
            - integer
            - 'null'
          minimum: 1
        placa:
          type: string
        capacidadPasajeros:
          type: integer
          minimum: 1
        estado:
          $ref: '#/components/schemas/EstadoMicro'

    MicroAsignacionRequest:
      type: object
      required: [conductorActualId]
      additionalProperties: false
      properties:
        conductorActualId:
          type:
            - integer
            - 'null'
          minimum: 1
          description: ID de CONDUCTOR_PERFIL; null para liberar la asignación

    MicroEnVivo:
      type: object
      required: [microId, empresaId, rutaId, conductorPerfilId, placa, capacidadPasajeros, lat, lng, speed, status, lastSeen]
      additionalProperties: false
      properties:
        microId:
          type: integer
          minimum: 1
        empresaId:
          type: integer
          minimum: 1
        rutaId:
          type: integer
          minimum: 1
        conductorPerfilId:
          type:
            - integer
            - 'null'
          minimum: 1
        placa:
          type: string
        capacidadPasajeros:
          type: integer
          minimum: 1
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        speed:
          type: number
          format: double
          minimum: 0
          description: Velocidad en m/s
        status:
          type: string
          enum: [moviendo, detenido, desconectado]
          description: |
            Estado en vivo del micro. Se deriva de `MICRO.estado` y de
            `CONDUCTOR_PERFIL.estado_operativo`:
            moviendo = en_recorrido, detenido = disponible, desconectado = sin_conexion.
        lastSeen:
          type: integer
          format: int64
          minimum: 0
          description: Timestamp Unix ms del último GPS

    PosicionGps:
      type: object
      required: [id, microId, lat, lng, speed, fechaHora]
      additionalProperties: false
      description: |
        Posición persistida en POSICION_GPS. `lat`, `lng` y `speed` equivalen a
        `latitud`, `longitud` y `velocidad` en la base de datos.
      properties:
        id:
          type: integer
          minimum: 1
        microId:
          type: integer
          minimum: 1
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        speed:
          type: number
          format: double
          minimum: 0
        fechaHora:
          type: string
          format: date-time

    Plan:
      type: object
      required: [id, nombrePlan, costo]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        nombrePlan:
          type: string
        costo:
          type: number
          format: double
          minimum: 0

    PlanCreate:
      type: object
      required: [nombrePlan, costo]
      additionalProperties: false
      properties:
        nombrePlan:
          type: string
        costo:
          type: number
          format: double
          minimum: 0

    PlanUpdate:
      type: object
      additionalProperties: false
      properties:
        nombrePlan:
          type: string
        costo:
          type: number
          format: double
          minimum: 0

    Suscripcion:
      type: object
      required: [id, usuarioId, planId, fechaInicio, fechaVencimiento, estado]
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
        usuarioId:
          type: integer
          minimum: 1
          description: ID del pasajero
        planId:
          type: integer
          minimum: 1
        fechaInicio:
          type: string
          format: date
        fechaVencimiento:
          type: string
          format: date
        estado:
          $ref: '#/components/schemas/EstadoSuscripcion'

    SuscripcionCreate:
      type: object
      required: [planId]
      additionalProperties: false
      properties:
        usuarioId:
          type: integer
          minimum: 1
          description: Solo admin_general; el pasajero usa su propio usuario
        planId:
          type: integer
          minimum: 1
        fechaInicio:
          type: string
          format: date
          description: Si se omite, el servidor usa la fecha actual

    SuscripcionUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        estado:
          $ref: '#/components/schemas/EstadoSuscripcion'
        fechaVencimiento:
          type: string
          format: date

    TrackingPositionRequest:
      type: object
      required: [lat, lng, speed]
      additionalProperties: false
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Latitud WGS84
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: Longitud WGS84
        speed:
          type: number
          format: double
          minimum: 0
          description: Velocidad en m/s

    TrackingPositionResponse:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true

    TrackingStopResponse:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true

    ErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string

    RouteJoinedResponse:
      type: object
      required: [rutaId, micros]
      additionalProperties: false
      properties:
        rutaId:
          type: integer
          minimum: 1
        micros:
          type: array
          items:
            $ref: '#/components/schemas/MicroEnVivo'

    EtaRequest:
      type: object
      required: [microId, lat, lng]
      additionalProperties: false
      properties:
        microId:
          type: integer
          minimum: 1
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180

    EtaResponse:
      oneOf:
        - type: object
          required: [microId, etaSeconds, estimated]
          additionalProperties: false
          properties:
            microId:
              type: integer
              minimum: 1
            etaSeconds:
              type: integer
              minimum: 0
            estimated:
              type: boolean
              const: true
        - type: object
          required: [error]
          additionalProperties: false
          properties:
            error:
              type: string
