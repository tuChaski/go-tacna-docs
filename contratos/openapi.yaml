# CONTRATO DE LA API - fuente de verdad para backend, web y movil
# OpenAPI 3.1, prefijo /api/v1
# Responsable: Royfrankly (revisado por David)
# Nombres de payloads: glosario oficial (micro, no bus)
# Actualizado al modelo entidad-relacion multiempresa.
# Pendiente: alinear eventos-websocket.md y payload-gps.md con los nuevos roles.
openapi: 3.1.0
info:
  title: go-tacna API
  version: 0.2.0
  description: |
    Contrato de la API REST compartida por web y movil.

    El modelo es multiempresa: cada empresa administra sus rutas, micros y
    conductores. Los usuarios tienen uno de los roles `pasajero`, `conductor`,
    `admin_general` o `admin_empresa`.

    Los eventos WebSocket y los esquemas GPS complementarios se documentan en
    `eventos-websocket.md` y `payload-gps.md`.
servers:
  - url: https://api.tuchaski.org/api/v1
    description: Producción
  - url: http://localhost:3001
    description: Desarrollo local (sin prefijo /api/v1)
tags:
  - name: Auth
    description: Autenticación y sesión
  - name: Usuarios
    description: Usuarios de la plataforma
  - name: Empresas
    description: Empresas operadoras
  - name: Rutas
    description: Rutas operadas por una empresa
  - name: Micros
    description: Vehículos y su asignación operativa
  - name: Conductores
    description: Perfiles de conductor
  - name: Administradores de empresa
    description: Perfiles de administrador de empresa
  - name: Planes
    description: Catálogo de planes
  - name: Suscripciones
    description: Suscripciones de los pasajeros
  - name: Tracking
    description: Recepción de posiciones GPS del conductor
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: |
        Autentica por DNI o correo. Devuelve un token JWT válido para la API y
        para el servidor de tiempo real.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar token de acceso
      description: |
        Solicita un nuevo token de acceso a partir de un refresh token vigente.
        La persistencia y rotación del refresh token queda pendiente de definición
        porque el ERD no incluye una tabla para él.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar sesión
      description: |
        Invalida la sesión del cliente. El JWT es stateless; si se implementa una
        lista de revocación, el servidor puede rechazar tokens con `jti` revocado.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesión cerrada
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Obtener usuario autenticado
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /usuarios:
    get:
      tags: [Usuarios]
      summary: Listar usuarios
      description: |
        `admin_general` ve todos los usuarios. `admin_empresa` solo ve usuarios
        vinculados a perfiles de su propia empresa.
      operationId: listUsuarios
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RolQuery'
        - $ref: '#/components/parameters/EmpresaIdQuery'
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Usuarios]
      summary: Crear usuario
      description: |
        `admin_general` puede crear cualquier rol. `admin_empresa` solo puede
        crear usuarios con rol `conductor`.
      operationId: createUsuario
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreate'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Usuarios]
      summary: Obtener usuario
      operationId: getUsuario
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Usuarios]
      summary: Actualizar usuario
      description: |
        `admin_empresa` solo puede actualizar usuarios vinculados a perfiles de
        su empresa y no puede cambiar el rol del usuario.
      operationId: updateUsuario
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioUpdate'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Usuarios]
      summary: Eliminar usuario
      operationId: deleteUsuario
      x-required-roles: [admin_general]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Usuario eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /empresas:
    get:
      tags: [Empresas]
      summary: Listar empresas
      operationId: listEmpresas
      x-required-roles: [admin_general]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de empresas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Empresa'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Empresas]
      summary: Crear empresa
      operationId: createEmpresa
      x-required-roles: [admin_general]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaCreate'
      responses:
        '201':
          description: Empresa creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /empresas/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Empresas]
      summary: Obtener empresa
      description: "`admin_empresa` solo puede consultar su propia empresa."
      operationId: getEmpresa
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Empresa encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Empresas]
      summary: Actualizar empresa
      description: "`admin_empresa` solo puede actualizar su propia empresa."
      operationId: updateEmpresa
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaUpdate'
      responses:
        '200':
          description: Empresa actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Empresa'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Empresas]
      summary: Eliminar empresa
      operationId: deleteEmpresa
      x-required-roles: [admin_general]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Empresa eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /rutas:
    get:
      tags: [Rutas]
      summary: Listar rutas
      description: |
        `admin_general` ve todas. `admin_empresa` y `conductor` ven las rutas de
        su empresa. `pasajero` puede consultar las rutas disponibles.
      operationId: listRutas
      x-required-roles: [pasajero, conductor, admin_general, admin_empresa]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EmpresaIdQuery'
      responses:
        '200':
          description: Lista de rutas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ruta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Rutas]
      summary: Crear ruta
      description: |
        `admin_empresa` solo puede crear rutas en su propia empresa.
      operationId: createRuta
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RutaCreate'
      responses:
        '201':
          description: Ruta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /rutas/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Rutas]
      summary: Obtener ruta
      operationId: getRuta
      x-required-roles: [pasajero, conductor, admin_general, admin_empresa]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ruta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Rutas]
      summary: Actualizar ruta
      operationId: updateRuta
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RutaUpdate'
      responses:
        '200':
          description: Ruta actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ruta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Rutas]
      summary: Eliminar ruta
      operationId: deleteRuta
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Ruta eliminada
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /rutas/{id}/micros:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Rutas]
      summary: Listar micros en vivo de una ruta
      description: Devuelve el estado actual de los micros asignados a la ruta.
      operationId: listMicrosByRuta
      x-required-roles: [pasajero, conductor, admin_general, admin_empresa]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Micros de la ruta
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MicroEnVivo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /micros:
    get:
      tags: [Micros]
      summary: Listar micros
      description: |
        `admin_general` ve todos. `admin_empresa` y `conductor` solo los de su
        empresa.
      operationId: listMicros
      x-required-roles: [admin_general, admin_empresa, conductor]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EmpresaIdQuery'
        - $ref: '#/components/parameters/RutaIdQuery'
      responses:
        '200':
          description: Lista de micros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Micro'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Micros]
      summary: Crear micro
      description: |
        El micro y la ruta deben pertenecer a la misma empresa. `admin_empresa`
        solo puede crear micros en su propia empresa.
      operationId: createMicro
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MicroCreate'
      responses:
        '201':
          description: Micro creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Micro'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /micros/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Micros]
      summary: Obtener micro
      operationId: getMicro
      x-required-roles: [admin_general, admin_empresa, conductor]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Micro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Micro'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Micros]
      summary: Actualizar micro
      description: |
        La ruta asignada debe pertenecer a la misma empresa que el micro.
        `admin_empresa` solo puede actualizar micros de su propia empresa.
      operationId: updateMicro
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MicroUpdate'
      responses:
        '200':
          description: Micro actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Micro'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Micros]
      summary: Eliminar micro
      operationId: deleteMicro
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Micro eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /micros/{id}/conductor:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Micros]
      summary: Asignar conductor al micro
      description: |
        Asigna un `CONDUCTOR_PERFIL` como conductor actual del micro. Enviar
        `conductorActualId: null` libera la asignación. El conductor y el micro
        deben pertenecer a la misma empresa. Un conductor no debe tener más de
        un micro asignado; el servidor debe liberar la asignación anterior.
      operationId: assignConductorToMicro
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MicroAsignacionRequest'
      responses:
        '200':
          description: Conductor asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Micro'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /micros/{id}/posiciones:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Micros]
      summary: Consultar historial de posiciones GPS
      description: |
        `admin_general` puede consultar cualquier micro. `admin_empresa` solo
        micros de su empresa. `conductor` solo el micro que tiene asignado.
      operationId: listPosicionesByMicro
      x-required-roles: [admin_general, admin_empresa, conductor]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DesdeQuery'
        - $ref: '#/components/parameters/HastaQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Historial de posiciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PosicionGps'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /conductores:
    get:
      tags: [Conductores]
      summary: Listar perfiles de conductor
      description: |
        `admin_general` ve todos. `admin_empresa` solo los de su empresa.
      operationId: listConductores
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EmpresaIdQuery'
        - $ref: '#/components/parameters/EstadoOperativoQuery'
      responses:
        '200':
          description: Lista de conductores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConductorPerfil'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Conductores]
      summary: Crear perfil de conductor
      description: |
        Vincula un usuario existente con una empresa. El usuario debe tener rol
        `conductor`.
      operationId: createConductor
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConductorPerfilCreate'
      responses:
        '201':
          description: Perfil de conductor creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConductorPerfil'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /conductores/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Conductores]
      summary: Obtener perfil de conductor
      operationId: getConductor
      x-required-roles: [admin_general, admin_empresa]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conductor encontrado
          content:
            application/json:
              schema:
