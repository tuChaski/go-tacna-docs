# Contrato de la API de Go-Tacna
# OpenAPI 3.1. Prefijo público: /api/v1
# Entrada local: http://localhost:8001/api/v1 (Nginx -> gateway Laravel -> core)
openapi: 3.1.0
info:
  title: Go-Tacna API
  version: 1.0.0
  description: |
    Contrato REST del backend core de Go-Tacna. El frontend entra por el
    Nginx público (`http://localhost:8001/api/v1` en local), que reenvía al
    API Gateway Laravel y este al core.

    Convenciones:
    - Autenticación JWT con `Authorization: Bearer <token>`.
    - Los listados usan paginación Laravel: `data`, `links` y `meta`.
    - Los recursos individuales envuelven el objeto en `data`.
    - Los borrados exitosos devuelven `200` con `{ success, message }`.
    - Los errores de validación devuelven `422` con `{ success: false, message, errors }`.
    - Las rutas, micros y planes son de lectura pública; con token de
      administrador incluyen registros inactivos y respetan el alcance por empresa.
    - `trazado_ruta` se intercambia como GeoJSON `LineString`. El orden de cada
      coordenada es `[longitud, latitud]` (EPSG:4326).
servers:
  - url: http://localhost:8001/api/v1
    description: Entorno local (Nginx público)
  - url: https://go-tacna.site/api/v1
    description: Producción
tags:
  - name: Autenticación
    description: Registro, login, sesión y renovación de tokens.
  - name: Catálogo público
    description: Rutas, micros activos y planes visibles para el frontend.
  - name: Empresas
    description: Administración de empresas.
  - name: Usuarios
    description: Administración global de cuentas.
  - name: Administradores de empresa
    description: Vínculos entre usuarios admin_empresa y empresas.
  - name: Conductores
    description: Perfiles de conductor y operación de tracking.
  - name: Posiciones GPS
    description: Historial y administración de posiciones.
  - name: Planes
    description: Planes de suscripción.
  - name: Suscripciones
    description: Suscripciones administradas y suscripciones del pasajero.
security:
  - bearerAuth: []
paths:
  # ---------------------------------------------------------------------------
  # Autenticación
  # ---------------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Autenticación]
      summary: Registrar un pasajero
      description: Crea una cuenta con rol `pasajero` y devuelve un token JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Usuario registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: |
        Acepta `correo` y `password`. También se aceptan los alias `email` y
        `contrasena`. Un usuario inactivo recibe `403`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login correcto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [Autenticación]
      summary: Usuario autenticado
      description: Devuelve el usuario del token con sus perfiles y suscripciones.
      responses:
        '200':
          description: Usuario actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Autenticación]
      summary: Renovar token
      responses:
        '200':
          description: Token renovado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      description: Invalida el token actual.
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Catálogo público
  # ---------------------------------------------------------------------------
  /rutas:
    get:
      tags: [Catálogo público]
      summary: Listar rutas
      description: |
        Público. Sin token solo devuelve rutas activas. Con token de
        `admin_general` o `admin_empresa` devuelve también inactivas, limitadas
        a las empresas del administrador. `solo_activos=true` fuerza el filtro.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/EmpresaIdFilter'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SoloActivos'
      responses:
        '200':
          description: Listado paginado de rutas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutaPage'
    post:
      tags: [Empresas]
      summary: Crear ruta
      description: Requiere rol `admin_general` o `admin_empresa` con acceso a la empresa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RutaInput'
      responses:
        '201':
          description: Ruta creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /rutas/{ruta}:
    get:
      tags: [Catálogo público]
      summary: Ver ruta
      description: Público para rutas activas. Un administrador puede ver las de su alcance, incluidas inactivas.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RutaPath'
      responses:
        '200':
          description: Ruta con empresa y micros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutaResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Empresas]
      summary: Actualizar ruta
      description: Requiere rol `admin_general` o `admin_empresa` con acceso a la empresa.
      parameters:
        - $ref: '#/components/parameters/RutaPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RutaUpdateInput'
      responses:
        '200':
          description: Ruta actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Empresas]
      summary: Actualizar ruta parcialmente
      parameters:
        - $ref: '#/components/parameters/RutaPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RutaUpdateInput'
      responses:
        '200':
          description: Ruta actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Empresas]
      summary: Eliminar ruta
      description: Falla con `409` si la ruta tiene micros asignados.
      parameters:
        - $ref: '#/components/parameters/RutaPath'
      responses:
        '200':
          description: Ruta eliminada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /rutas/{ruta}/estado:
    patch:
      tags: [Empresas]
      summary: Activar o desactivar ruta
      parameters:
        - $ref: '#/components/parameters/RutaPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoActivoInput'
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RutaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /micros/activos:
    get:
      tags: [Catálogo público]
      summary: Listar micros activos
      description: |
        Público. Devuelve micros en estado `disponible` o `en_recorrido`, de
        empresas activas, con ruta activa o sin ruta. Incluye empresa, ruta,
        conductor actual y última posición.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPageFifty'
        - $ref: '#/components/parameters/EmpresaIdFilter'
        - $ref: '#/components/parameters/RutaIdFilter'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Listado paginado de micros activos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicroPage'

  /micros:
    get:
      tags: [Empresas]
      summary: Listar micros
      description: Requiere rol `admin_general` o `admin_empresa`. Incluye inactivos y respeta el alcance por empresa.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/EmpresaIdFilter'
        - $ref: '#/components/parameters/RutaIdFilter'
        - $ref: '#/components/parameters/EstadoMicroFilter'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Listado paginado de micros.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicroPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Empresas]
      summary: Crear micro
      description: Requiere rol `admin_general` o `admin_empresa` con acceso a la empresa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MicroInput'
      responses:
        '201':
          description: Micro creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicroResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /micros/{micro}:
    get:
      tags: [Catálogo público]
      summary: Ver micro
      description: Público para micros `disponible` o `en_recorrido`. Incluye las últimas 20 posiciones.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MicroPath'
      responses:
        '200':
          description: Micro con empresa, ruta, conductor, última posición e historial reciente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicroResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Empresas]
      summary: Actualizar micro
      parameters:
        - $ref: '#/components/parameters/MicroPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MicroUpdateInput'
      responses:
        '200':
          description: Micro actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicroResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Empresas]
      summary: Actualizar micro parcialmente
      parameters:
        - $ref: '#/components/parameters/MicroPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MicroUpdateInput'
      responses:
        '200':
          description: Micro actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicroResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Empresas]
      summary: Eliminar micro
      description: Falla con `409` si el micro está en recorrido.
      parameters:
        - $ref: '#/components/parameters/MicroPath'
      responses:
        '200':
          description: Micro eliminado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /micros/{micro}/estado:
    patch:
      tags: [Empresas]
      summary: Cambiar estado del micro
      description: Si el micro tiene conductor, sincroniza su `estado_operativo`.
      parameters:
        - $ref: '#/components/parameters/MicroPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoMicroInput'
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicroResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /planes:
    get:
      tags: [Catálogo público]
      summary: Listar planes
      description: Público. Sin token solo devuelve planes activos; un admin_general puede filtrar por `activo`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Activo'
      responses:
        '200':
          description: Listado paginado de planes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPage'
    post:
      tags: [Planes]
      summary: Crear plan
      description: Requiere rol `admin_general`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInput'
      responses:
        '201':
          description: Plan creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /planes/{plan}:
    get:
      tags: [Catálogo público]
      summary: Ver plan
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PlanPath'
      responses:
        '200':
          description: Plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Planes]
      summary: Actualizar plan
      description: Requiere rol `admin_general`.
      parameters:
        - $ref: '#/components/parameters/PlanPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInput'
      responses:
        '200':
          description: Plan actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Planes]
      summary: Actualizar plan parcialmente
      parameters:
        - $ref: '#/components/parameters/PlanPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInput'
      responses:
        '200':
          description: Plan actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Planes]
      summary: Eliminar plan
      description: Falla con `409` si el plan tiene suscripciones.
      parameters:
        - $ref: '#/components/parameters/PlanPath'
      responses:
        '200':
          description: Plan eliminado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /planes/{plan}/estado:
    patch:
      tags: [Planes]
      summary: Activar o desactivar plan
      description: Requiere rol `admin_general`.
      parameters:
        - $ref: '#/components/parameters/PlanPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoActivoInput'
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------------------
  # Empresas
  # ---------------------------------------------------------------------------
  /empresas:
    get:
      tags: [Empresas]
      summary: Listar empresas
      description: Requiere rol `admin_general` o `admin_empresa`; este último solo ve sus empresas.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Activo'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Listado paginado de empresas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Empresas]
      summary: Crear empresa
      description: Requiere rol `admin_general`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaInput'
      responses:
        '201':
          description: Empresa creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /empresas/{empresa}:
    get:
      tags: [Empresas]
      summary: Ver empresa
      parameters:
        - $ref: '#/components/parameters/EmpresaPath'
      responses:
        '200':
          description: Empresa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Empresas]
      summary: Actualizar empresa
      description: "`admin_general` o `admin_empresa` con acceso a la empresa."
      parameters:
        - $ref: '#/components/parameters/EmpresaPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaInput'
      responses:
        '200':
          description: Empresa actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Empresas]
      summary: Actualizar empresa parcialmente
      parameters:
        - $ref: '#/components/parameters/EmpresaPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpresaInput'
      responses:
        '200':
          description: Empresa actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Empresas]
      summary: Eliminar empresa
      description: Requiere `admin_general` y falla con `409` si tiene relaciones.
      parameters:
        - $ref: '#/components/parameters/EmpresaPath'
      responses:
        '200':
          description: Empresa eliminada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /empresas/{empresa}/estado:
    patch:
      tags: [Empresas]
      summary: Activar o desactivar empresa
      parameters:
        - $ref: '#/components/parameters/EmpresaPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoActivoInput'
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaResponse'
