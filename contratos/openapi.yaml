          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Suscripciones]
      summary: Actualizar suscripción parcialmente
      parameters:
        - $ref: '#/components/parameters/SuscripcionPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuscripcionUpdateInput'
      responses:
        '200':
          description: Suscripción actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuscripcionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Suscripciones]
      summary: Eliminar suscripción
      description: Requiere rol `admin_general`.
      parameters:
        - $ref: '#/components/parameters/SuscripcionPath'
      responses:
        '200':
          description: Suscripción eliminada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /suscripciones/{suscripcion}/estado:
    patch:
      tags: [Suscripciones]
      summary: Cambiar estado de suscripción
      description: Requiere rol `admin_general`.
      parameters:
        - $ref: '#/components/parameters/SuscripcionPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoSuscripcionInput'
      responses:
        '200':
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuscripcionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------------------
  # Suscripciones del pasajero
  # ---------------------------------------------------------------------------
  /mis-suscripciones:
    get:
      tags: [Suscripciones]
      summary: Mis suscripciones
      description: Devuelve solo las suscripciones del usuario autenticado.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Listado paginado de mis suscripciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuscripcionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Suscripciones]
      summary: Contratar suscripción
      description: Crea una suscripción `activa` para el usuario autenticado con un plan activo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiSuscripcionInput'
      responses:
        '201':
          description: Suscripción creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuscripcionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /mis-suscripciones/{suscripcion}:
    get:
      tags: [Suscripciones]
      summary: Ver mi suscripción
      parameters:
        - $ref: '#/components/parameters/SuscripcionPath'
      responses:
        '200':
          description: Suscripción del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuscripcionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /mis-suscripciones/{suscripcion}/cancelar:
    patch:
      tags: [Suscripciones]
      summary: Cancelar mi suscripción
      parameters:
        - $ref: '#/components/parameters/SuscripcionPath'
      responses:
        '200':
          description: Suscripción cancelada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuscripcionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token devuelto por `/auth/login` o `/auth/register`.

  parameters:
    Page:
      name: page
      in: query
      description: Número de página (1-based).
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Elementos por página. El backend no impone un máximo; se recomienda no superar 100.
      schema:
        type: integer
        minimum: 1
        default: 15
    PerPageFifty:
      name: per_page
      in: query
      description: Elementos por página. El backend no impone un máximo; se recomienda no superar 100.
      schema:
        type: integer
        minimum: 1
        default: 50
    Search:
      name: search
      in: query
      description: Búsqueda textual parcial.
      schema:
        type: string
        maxLength: 120
    Activo:
      name: activo
      in: query
      description: Filtra por estado activo.
      schema:
        type: boolean
    SoloActivos:
      name: solo_activos
      in: query
      description: Fuerza a devolver solo rutas activas. Solo aplica a administradores.
      schema:
        type: boolean
    EmpresaIdFilter:
      name: empresa_id
      in: query
      schema:
        type: integer
    RutaIdFilter:
      name: ruta_id
      in: query
      schema:
        type: integer
    MicroIdFilter:
      name: micro_id
      in: query
      schema:
        type: integer
    UsuarioIdFilter:
      name: usuario_id
      in: query
      schema:
        type: integer
    PlanIdFilter:
      name: plan_id
      in: query
      schema:
        type: integer
    EstadoMicroFilter:
      name: estado
      in: query
      schema:
        $ref: '#/components/schemas/EstadoMicro'
    EstadoOperativoFilter:
      name: estado_operativo
      in: query
      schema:
        $ref: '#/components/schemas/EstadoOperativo'
    EstadoSuscripcionFilter:
      name: estado
      in: query
      schema:
        $ref: '#/components/schemas/EstadoSuscripcion'
    RolFilter:
      name: rol
      in: query
      schema:
        $ref: '#/components/schemas/Rol'
    Desde:
      name: desde
      in: query
      description: Fecha/hora mínima inclusive.
      schema:
        type: string
        format: date-time
    Hasta:
      name: hasta
      in: query
      description: Fecha/hora máxima inclusive.
      schema:
        type: string
        format: date-time
    RutaPath:
      name: ruta
      in: path
      required: true
      schema:
        type: integer
    MicroPath:
      name: micro
      in: path
      required: true
      schema:
        type: integer
    EmpresaPath:
      name: empresa
      in: path
      required: true
      schema:
        type: integer
    UsuarioPath:
      name: usuario
      in: path
      required: true
      schema:
        type: integer
    PlanPath:
      name: plan
      in: path
      required: true
      schema:
        type: integer
    ConductorPath:
      name: conductor
      in: path
      required: true
      schema:
        type: integer
    AdministradorEmpresaPath:
      name: administrador_empresa
      in: path
      required: true
      schema:
        type: integer
    PosicionPath:
      name: posicion
      in: path
      required: true
      schema:
        type: integer
    SuscripcionPath:
      name: suscripcion
      in: path
      required: true
      schema:
        type: integer

  schemas:
    Rol:
      type: string
      enum: [pasajero, conductor, admin_general, admin_empresa]
    EstadoMicro:
      type: string
      enum: [disponible, en_recorrido, mantenimiento, inactivo]
    EstadoOperativo:
      type: string
      enum: [disponible, en_recorrido, sin_conexion]
    EstadoSuscripcion:
      type: string
      enum: [activa, vencida, cancelada]
    TipoToken:
      type: string
      enum: [bearer]

    GeoJsonLineString:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [LineString]
        coordinates:
          type: array
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
            description: '[longitud, latitud] en EPSG:4326.'

    Usuario:
      type: object
      required: [id, dni, nombre, apellido, correo, telefono, rol, activo]
      properties:
        id:
          type: integer
        dni:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        correo:
          type: string
          format: email
        telefono:
          type: string
        rol:
          $ref: '#/components/schemas/Rol'
        activo:
          type: boolean
        conductor_perfil:
          $ref: '#/components/schemas/ConductorPerfil'
        administrador_empresa_perfiles:
          type: array
          items:
            $ref: '#/components/schemas/AdministradorEmpresaPerfil'
        empresas:
          type: array
          items:
            $ref: '#/components/schemas/Empresa'
        suscripciones:
          type: array
          items:
            $ref: '#/components/schemas/Suscripcion'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Empresa:
      type: object
      required: [id, ruc, razon_social, telefono, direccion, activo]
      properties:
        id:
          type: integer
        ruc:
          type: string
          minLength: 11
          maxLength: 11
        razon_social:
          type: string
        telefono:
          type: string
        direccion:
          type: string
        activo:
          type: boolean
        rutas:
          type: array
          items:
            $ref: '#/components/schemas/Ruta'
        micros:
          type: array
          items:
            $ref: '#/components/schemas/Micro'
        conductores:
          type: array
          items:
            $ref: '#/components/schemas/ConductorPerfil'
        administradores:
          type: array
          items:
            $ref: '#/components/schemas/AdministradorEmpresaPerfil'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Ruta:
      type: object
      required: [id, empresa_id, nombre_ruta, activo]
      properties:
        id:
          type: integer
        empresa_id:
          type: integer
        nombre_ruta:
          type: string
        trazado_ruta:
          oneOf:
            - $ref: '#/components/schemas/GeoJsonLineString'
            - type: 'null'
        activo:
          type: boolean
        empresa:
          $ref: '#/components/schemas/Empresa'
        micros:
          type: array
          items:
            $ref: '#/components/schemas/Micro'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Micro:
      type: object
      required: [id, empresa_id, placa, capacidad_pasajeros, estado]
      properties:
        id:
          type: integer
        empresa_id:
          type: integer
        ruta_id:
          type: [integer, 'null']
        conductor_actual_id:
          type: [integer, 'null']
        placa:
          type: string
        capacidad_pasajeros:
          type: integer
        estado:
          $ref: '#/components/schemas/EstadoMicro'
        empresa:
          $ref: '#/components/schemas/Empresa'
        ruta:
          $ref: '#/components/schemas/Ruta'
        conductor_actual:
          $ref: '#/components/schemas/ConductorPerfil'
        ultima_posicion:
          $ref: '#/components/schemas/PosicionGps'
        posiciones:
          type: array
          items:
            $ref: '#/components/schemas/PosicionGps'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConductorPerfil:
      type: object
      required: [id, usuario_id, empresa_id, licencia_conducir, estado_operativo]
      properties:
        id:
          type: integer
        usuario_id:
          type: integer
        empresa_id:
          type: integer
        licencia_conducir:
          type: string
        estado_operativo:
          $ref: '#/components/schemas/EstadoOperativo'
        usuario:
          $ref: '#/components/schemas/Usuario'
        empresa:
          $ref: '#/components/schemas/Empresa'
        micro_actual:
          $ref: '#/components/schemas/Micro'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdministradorEmpresaPerfil:
      type: object
      required: [id, usuario_id, empresa_id]
      properties:
        id:
          type: integer
        usuario_id:
          type: integer
        empresa_id:
          type: integer
        cargo:
          type: [string, 'null']
        usuario:
          $ref: '#/components/schemas/Usuario'
        empresa:
          $ref: '#/components/schemas/Empresa'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PosicionGps:
      type: object
      required: [id, micro_id, latitud, longitud, velocidad, fecha_hora]
      properties:
        id:
          type: integer
        micro_id:
          type: integer
        latitud:
          type: number
          format: double
        longitud:
          type: number
          format: double
        velocidad:
          type: number
          format: float
        fecha_hora:
          type: string
          format: date-time
        micro:
          $ref: '#/components/schemas/Micro'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Plan:
      type: object
      required: [id, nombre_plan, costo, activo]
      properties:
        id:
          type: integer
        nombre_plan:
          type: string
        costo:
          type: number
          format: double
        activo:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Suscripcion:
      type: object
      required: [id, usuario_id, plan_id, fecha_inicio, fecha_vencimiento, estado]
      properties:
        id:
          type: integer
        usuario_id:
          type: integer
        plan_id:
          type: integer
        fecha_inicio:
          type: string
          format: date
        fecha_vencimiento:
          type: string
          format: date
        estado:
          $ref: '#/components/schemas/EstadoSuscripcion'
        usuario:
          $ref: '#/components/schemas/Usuario'
        plan:
          $ref: '#/components/schemas/Plan'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginationLinks:
      type: object
      properties:
        first:
          type: [string, 'null']
        last:
          type: [string, 'null']
        prev:
          type: [string, 'null']
        next:
          type: [string, 'null']
    PaginationLink:
      type: object
      properties:
        url:
          type: [string, 'null']
        label:
          type: string
        active:
          type: boolean
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: [integer, 'null']
        last_page:
          type: integer
        links:
          type: array
          items:
            $ref: '#/components/schemas/PaginationLink'
        path:
          type: string
        per_page:
          type: integer
        to:
          type: [integer, 'null']
        total:
          type: integer
    PaginatedResponse:
      type: object
      required: [data, links, meta, success]
      properties:
        data:
          type: array
          items: {}
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        success:
          type: boolean

    UsuarioPage:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Usuario'
    EmpresaPage:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Empresa'
    RutaPage:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Ruta'
    MicroPage:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Micro'
    ConductorPerfilPage:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ConductorPerfil'
    AdministradorEmpresaPerfilPage:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AdministradorEmpresaPerfil'
    PosicionGpsPage:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/PosicionGps'
    PlanPage:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Plan'
    SuscripcionPage:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Suscripcion'

    LoginInput:
      type: object
      required: [correo, password]
      properties:
        correo:
          type: string
          format: email
          description: También se acepta el alias `email`.
        password:
          type: string
          format: password
          description: También se acepta el alias `contrasena`.
    RegisterInput:
      type: object
      required: [dni, nombre, apellido, correo, telefono, password]
      properties:
        dni:
          type: string
          maxLength: 20
        nombre:
          type: string
          maxLength: 120
        apellido:
          type: string
          maxLength: 120
        correo:
          type: string
          format: email
          maxLength: 150
        telefono:
          type: string
          maxLength: 30
        password:
          type: string
          format: password
          minLength: 8
    EmpresaInput:
      type: object
      required: [ruc, razon_social, telefono, direccion]
      properties:
        ruc:
          type: string
          minLength: 11
          maxLength: 11
        razon_social:
          type: string
          maxLength: 180
        telefono:
          type: string
          maxLength: 30
        direccion:
          type: string
          maxLength: 255
        activo:
          type: boolean
    RutaInput:
      type: object
      required: [empresa_id, nombre_ruta, trazado_ruta]
      properties:
        empresa_id:
          type: integer
        nombre_ruta:
          type: string
          maxLength: 180
        trazado_ruta:
          $ref: '#/components/schemas/GeoJsonLineString'
        activo:
          type: boolean
    MicroInput:
      type: object
      required: [empresa_id, placa]
      properties:
        empresa_id:
          type: integer
        ruta_id:
          type: [integer, 'null']
          description: Debe pertenecer a la misma empresa.
        conductor_actual_id:
          type: [integer, 'null']
          description: Perfil de conductor de la misma empresa; un conductor solo puede tener un micro.
        placa:
          type: string
          maxLength: 20
        capacidad_pasajeros:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        estado:
          $ref: '#/components/schemas/EstadoMicro'
    UsuarioInput:
      type: object
      required: [dni, nombre, apellido, correo, telefono, rol]
      properties:
        dni:
          type: string
          maxLength: 20
        nombre:
          type: string
          maxLength: 120
        apellido:
          type: string
          maxLength: 120
        correo:
          type: string
          format: email
          maxLength: 150
        telefono:
          type: string
          maxLength: 30
        rol:
          $ref: '#/components/schemas/Rol'
        activo:
          type: boolean
        password:
          type: string
          format: password
          minLength: 8
          description: Obligatorio al crear; opcional al actualizar.
        empresa_id:
          type: integer
          description: Requerido para conductor/admin_empresa con perfil.
        cargo:
          type: string
          maxLength: 120
        licencia_conducir:
          type: string
          maxLength: 120
        estado_operativo:
          $ref: '#/components/schemas/EstadoOperativo'
    AdministradorEmpresaInput:
      type: object
      required: [usuario_id, empresa_id]
      properties:
        usuario_id:
          type: integer
          description: Usuario con rol `admin_empresa`.
        empresa_id:
          type: integer
        cargo:
          type: [string, 'null']
          maxLength: 120
    ConductorCreateInput:
      type: object
      required: [empresa_id, licencia_conducir]
      properties:
        usuario_id:
          type: integer
          description: Cuenta existente con rol pasajero o conductor.
        nombre:
          type: string
          maxLength: 120
        apellido:
          type: string
          maxLength: 120
        dni:
          type: string
          maxLength: 20
        correo:
          type: string
          format: email
          maxLength: 150
        telefono:
          type: string
          maxLength: 30
        password:
          type: string
          format: password
          minLength: 8
        empresa_id:
          type: integer
        licencia_conducir:
          type: string
          maxLength: 120
        estado_operativo:
          $ref: '#/components/schemas/EstadoOperativo'
      description: |
        Envía `usuario_id` o los datos de la cuenta nueva. Si no envías
        `usuario_id`, `nombre`, `apellido`, `dni`, `correo`, `telefono` y
        `password` son obligatorios.
    ConductorUpdateInput:
      type: object
      properties:
        empresa_id:
          type: integer
        licencia_conducir:
          type: string
          maxLength: 120
        estado_operativo:
          $ref: '#/components/schemas/EstadoOperativo'
    PosicionInput:
      type: object
      required: [micro_id, latitud, longitud]
      properties:
        micro_id:
          type: integer
        latitud:
          type: number
          minimum: -90
          maximum: 90
        longitud:
          type: number
          minimum: -180
          maximum: 180
        velocidad:
          type: number
          minimum: 0
        fecha_hora:
          type: string
          format: date-time
    ConductorPosicionInput:
      type: object
      required: [latitud, longitud]
      properties:
        latitud:
          type: number
          minimum: -90
          maximum: 90
          description: También se acepta `lat`.
        longitud:
          type: number
          minimum: -180
          maximum: 180
          description: También se acepta `lng`.
        velocidad:
          type: number
          minimum: 0
          description: También se acepta `speed`.
        fecha_hora:
          type: string
          format: date-time
    PlanInput:
      type: object
      required: [nombre_plan, costo]
      properties:
        nombre_plan:
          type: string
          maxLength: 120
        costo:
          type: number
          minimum: 0
        activo:
          type: boolean
    SuscripcionInput:
      type: object
      required: [usuario_id, plan_id, fecha_inicio, fecha_vencimiento]
      properties:
        usuario_id:
          type: integer
          description: Usuario con rol pasajero.
        plan_id:
          type: integer
        fecha_inicio:
          type: string
          format: date
        fecha_vencimiento:
          type: string
          format: date
        estado:
          $ref: '#/components/schemas/EstadoSuscripcion'
    MiSuscripcionInput:
      type: object
      required: [plan_id, fecha_inicio, fecha_vencimiento]
      properties:
        plan_id:
          type: integer
          description: Plan activo.
        fecha_inicio:
          type: string
          format: date
          description: Debe ser hoy o una fecha futura.
        fecha_vencimiento:
          type: string
          format: date
          description: Debe ser igual o posterior a `fecha_inicio`.
    RutaUpdateInput:
      type: object
      properties:
        empresa_id:
          type: integer
        nombre_ruta:
          type: string
          maxLength: 180
        trazado_ruta:
          $ref: '#/components/schemas/GeoJsonLineString'
        activo:
          type: boolean
    MicroUpdateInput:
      type: object
      properties:
        empresa_id:
          type: integer
        ruta_id:
          type: [integer, 'null']
        conductor_actual_id:
          type: [integer, 'null']
        placa:
          type: string
          maxLength: 20
        capacidad_pasajeros:
          type: integer
          minimum: 1
          maximum: 100
        estado:
          $ref: '#/components/schemas/EstadoMicro'
    PosicionUpdateInput:
      type: object
      properties:
        micro_id:
          type: integer
        latitud:
          type: number
          minimum: -90
          maximum: 90
        longitud:
          type: number
          minimum: -180
          maximum: 180
        velocidad:
          type: number
          minimum: 0
        fecha_hora:
          type: string
          format: date-time
    SuscripcionUpdateInput:
      type: object
      properties:
        usuario_id:
          type: integer
          description: Usuario con rol pasajero.
        plan_id:
          type: integer
        fecha_inicio:
          type: string
          format: date
        fecha_vencimiento:
          type: string
          format: date
        estado:
          $ref: '#/components/schemas/EstadoSuscripcion'
    EstadoActivoInput:
      type: object
      required: [activo]
      properties:
        activo:
          type: boolean
    EstadoMicroInput:
      type: object
      required: [estado]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoMicro'
    EstadoOperativoInput:
      type: object
      required: [estado_operativo]
      properties:
        estado_operativo:
          $ref: '#/components/schemas/EstadoOperativo'
    EstadoSuscripcionInput:
      type: object
      required: [estado]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoSuscripcion'

    LoginData:
      type: object
      required: [usuario, token, tipo]
      properties:
        usuario:
          $ref: '#/components/schemas/Usuario'
        token:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoToken'
    LoginResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/LoginData'
    AuthMeResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Usuario'
    RefreshResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          required: [token, tipo]
          properties:
            token:
              type: string
            tipo:
              $ref: '#/components/schemas/TipoToken'
    FinalizarResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            micro_id:
              type: [integer, 'null']
            estado_operativo:
              $ref: '#/components/schemas/EstadoOperativo'
    MessageResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object

    UsuarioResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Usuario'
    EmpresaResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Empresa'
    RutaResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Ruta'
    MicroResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Micro'
    ConductorPerfilResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/ConductorPerfil'
    AdministradorEmpresaPerfilResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AdministradorEmpresaPerfil'
    PosicionGpsResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PosicionGps'
    PlanResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Plan'
    SuscripcionResponse:
      allOf:
        - $ref: '#/components/schemas/MessageResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Suscripcion'

    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    Unauthorized:
      description: Token ausente, inválido o expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: El rol o el alcance por empresa no permite la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso inexistente o no visible para el usuario.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: La operación choca con una regla de negocio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Datos inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
